<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gestion De Livers</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <div class="head">
        <h1>Gestion De Livers</h1>
        <p>Livers Management System</p>
      </div>

      <div class="input">
        <h2>Ajouter Un Livre</h2>
        <div id="ajout">
          <input
            type="text"
            id="title"
            required
            placeholder="Ajouter un Livre"
          />
          <input
            type="text"
            id="author"
            required
            placeholder="Qui a écrit  ?"
          />
          <input type="number" id="year" placeholder="Ex:1993" />
          <input type="text" id="genre" placeholder='Ex:"Roman" ..' />
          <input
            type="text"
            name=""
            id="description"
            required
            placeholder="écrit un Description"
          />
          <input type="text" placeholder="Reading..." id="statu" required />
          <button id="ajout-btn" type="submit">Ajoute</button>
        </div>
        <p id="ajout-errur" class="hidden"></p>
      </div>
      <div id="cher-trie-box">
        <div id="cherch-box">
          <h2 id="cherch-title">Rechercher Un Livre</h2>
          <input
            type="text"
            id="cherch-input"
            placeholder="Entre le nome de live ou author"
          />
          <div id="btns-cherch">
            <button id="cherch-btn-name">By Name</button>
            <button id="cherch-btn-author">By Author</button>
          </div>
          <p id="cherch-erur" class="hidden"></p>
        </div>

        <div id="trie-box">
          <h2 id="trie-title">Trier</h2>
          <label for="trie-option">chose your trier</label>
          <select  id="trie-option">
            <option value="">choiser un type de trie</option>
            <option value="Titre">Titre</option>
            <option value="Author">Author</option>
            <option value="Année">Année</option>
          </select>
          <p id="trie-errur" class="">hhhhhhhhh</p>
        </div>
      </div>
      
       <div class="hidden" id="table-cherch">
        <h2 id="result-title">votre recherch</h2>
            <table id="table-cherch">
              <thead>
                <tr id="tableRow1">
                  <th>ID</th>
                  <th>Title</th>
                  <th>Author</th>
                  <th>Year</th>
                  <th>Gender</th>
                  <th>Description</th>
                  <th>status</th>
                </tr>
              </thead>
              <tbody id="tbady-cherch">
                
              </tbody>
            </table>
          </div>
      <div>
        <p id="cherch-errur" class="hidden">the result is not fond</p>
      </div>
      <h2 id="table-title">Votre Bibliothèque</h2>
      <div class="outputs">
        <table id="bookTable">
          <thead>
            <tr id="tableRow1">
              <th>ID</th>
              <th>Title</th>
              <th>Author</th>
              <th>Year</th>
              <th>Gender</th>
              <th>Description</th>
              <th>status</th>
            </tr>
          </thead>
          <tbody id="books-table-body">
            <tr></tr>
          </tbody>
        </table>
      </div>
    </div>
    <script type="module" src="style.js"></script>
  </body>
</html>
