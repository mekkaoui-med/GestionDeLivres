<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gestion De Livers</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <div class="head">
        <h1>Gestion De Livers</h1>
        <p>Livers Management System</p>
      </div>

      <div class="input">
        <h2>Ajouter Un Livre</h2>
        <div id="ajout">
          <input
            type="text"
            id="title"
            required
            placeholder="Ajouter un Livre"
          />
          <input
            type="text"
            id="author"
            required
            placeholder="Qui a écrit  ?"
          />
          <input type="number" id="year" required placeholder="Ex:1993" />
          <input type="text" id="genre" required placeholder='Ex:"Roman" ..' />
          <input
            type="text"
            name=""
            id="description"
            required
            placeholder="écrit un Description"
          />
          <input type="text" placeholder="Reading..." id="statu" required />
          <button id="ajout-btn">Ajoute</button>
        </div>
        <h2></h2>
      </div>
      <div id="cher-trie-box">
        <div id="cherch-box">
          <h2>Rechercher Un Livre</h2>
          <input
            type="text"
            id="cherch-input"
            id="cherch-input"
            placeholder="Entre le nome de live ou author"
          />
          <button id="cherch-btn">Cherche</button>
        </div>

        <div id="trie-box">
          <h2 id="trie-title">Trier</h2>
          <label for="books">chose your trier</label>
          <select name="" id="">
            <option value="">Titre</option>
            <option value="">Author</option>
            <option value="">Année</option>
          </select>
        </div>
      </div>
      <div class="outputs">
        <table id="bookTable">
          <thead>
            <tr id="tableRow1">
              <th>ID</th>
              <th>Title</th>
              <th>Author</th>
              <th>Year</th>
              <th>Gender</th>
              <th>Description</th>
              <th>status</th>
            </tr>
          </thead>
          <tbody id="books-table-body"></tbody>
        </table>
      </div>
    </div>
    <script type="module" src="style.js"></script>
  </body>
</html>
